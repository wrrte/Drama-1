BasicSettings:
  ImageSize: [64, 64]  # YAML pull this as tuple in Python
  ImageChannel: 3
  ReplayBufferOnGPU: True
  Seed: 3710
  Env_name: ALE/Pong-v5
  Device: cuda:0
  Use_amp: True
  Use_cg: True
  Compile: True
  SavePath: None

Evaluate:
   EpisodeNum: 10
   NumEnvs: 10
   DuringTraining: True
   EverySteps: 2000

Demonstration:
  Enable: True
  SkipPretrain: True
  Directory: "demonstrations"
  MaxFiles: 1
  StrictActionCheck: True

  WorldModelDemoRatio: 0.25

  AgentDemoRatio: 0.0
  AgentDemoRatioStartStep: 10000
  AgentDemoRatioPeakStep: 20000
  AgentDemoRatioPeak: 0.5
  AgentDemoRatioEndStep: 100000
  AgentDemoRatioEnd: 0.1

  DemoRatioDecayScoreMultiplier: 0.9
  BaseEpisodeLength: 900
  DemoRatioDecayRate: 0.9
  DemoRatioDecayThreshold: 0.05
  BCWeightDecayRate: 0.65
  BCWeightDecayThreshold: 0.1


JointTrainAgent:
  SampleMaxSteps: 105000 # Just to make sure the last episode will finish, no training after 100k
  BufferMaxLength: 100000
  WorldModelWarmUp: 1792
  BehaviourWarmUp: 1792
  NumEnvs: 1
  BatchSize: 16
  BatchLength: 128
  ImagineBatchSize: 1024
  ImagineContextLength: 8
  ImagineBatchLength: 16
  RealityContextLength: 16
  TrainDynamicsEverySteps: 1
  TrainDynamicsEpoch: 1
  TrainAgentEverySteps: 1
  FreezeWorldModelAfterSteps: 100000
  FreezeBehaviourAfterSteps: 100000
  SaveEverySteps: 2000
  SaveModels: True
  Tau: 10
  ImaginationTau: 10
  Alpha: 1.0 # High focus on penalising high imagine counts regardless of train counts, less probability to be sampled
  Beta: 1.0 # High focus on penalising 

Models:
  WorldModel:
    dtype: float32
    Backbone: Mamba2 # Mamba, Mamba2, Transformer
    InChannels: 3
    Act: SiLU
    CategoricalDim: 32
    ClassDim: 32
    HiddenStateDim: 512
    Optimiser: Laprop
    LatentDiscreteType: naive
    Max_grad_norm: 1000
    Warmup_steps: 1000
    Dropout: 0.1
    Unimix_ratio: 0.01
    Weight_decay: 1.0e-4
    MacroLoss:
      Enable: true
      DistanceMetric: margin                 
      DBCAlpha: 0.3                       
      Margin: 0.92                         
      UIDimRatio: 8                       
      UIKLWeight: 1.0                     
      TriggerType: aux_value_diff         
      IncludePrevFrameInMacroLoss: false   
      DiffType: aux_value         
      ContrastiveSigmaRatio: 0.1          
      SigmaThreshold: 2.0
      EnableMaxRelativeThreshold: true
      MaxRelativeThresholdRatio: 0.03
      MaxRelativeThresholdDecay: 0.999
      HashBits: 10
      MaxQueuePerKey: 100000
      MaxPastSamples: 16
      LossScale: 0
      LazyRebuild:
        Enable: true
        SampleMultiplier: 8
        UseSimilarBuckets: true 
      EnableGlobalRebuild: true
      RebuildThreshold: 0.45
      RebuildCooldown: 3000
      RebuildBatchSize: 32768  
      DisableAfterStep: -1 
      StoreOnlyTriggered: false 
      Cutout:
        Enable: false
      LatentDropout:
        Enable: true
        Probability: 0.2
        Target: critic
    Adam:
      LearningRate: 1.0e-4
    Laprop:
      LearningRate: 4.0e-5
      Epsilon: 1.0e-20
    Encoder:
      Depth: 16
      Mults: [ 1, 2, 4, 8 ] #[1, 2, 3, 4, 4] ; [1, 2, 4, 8]
      Norm: rms
      Kernel: 5
      FirstStrideOne: False
      Padding: same
      InputSize: [ 3, 64, 64 ]
    Decoder:
      Depth: 16
      Mults: [ 1, 2, 4, 8 ] # [1, 2, 3, 4, 4] ; [1, 2, 4, 8]
      Norm: rms
      Kernel: 5
      Padding: same
      FirstStrideOne: True
      InputSize: [ 3, 64, 64 ]
      FinalLayerSigmoid: True
    Reward:
      HiddenUnits: 256
      LayerNum: 1
    Termination:
      HiddenUnits: 256
      LayerNum: 1      
    Transformer:
      FinalFeatureWidth: 4
      NumLayers: 2
      NumHeads: 8
    Mamba:
      n_layer: 2
      d_intermediate: 0
      ssm_cfg:
        d_state: 16

  Agent:
    dtype: float32
    Policy: AC # AC or PPO
    Unimix_ratio: 0
    AC:
      NumLayers: 3    
      Gamma: 0.985
      Lambda: 0.95
      EntropyCoef: 3.e-4
      Max_grad_norm: 100
      Warmup_steps: 1000
      Act: SiLU
      Optimiser: Laprop
      Adam:
        LearningRate: 3.0e-5
        Epsilon: 1.0e-5
      Laprop:
        LearningRate: 4.0e-5
        Epsilon: 1.0e-20
      Actor:
        HiddenUnits: 256
      Critic:
        HiddenUnits: 512  
    PPO:
      NumLayers: 3
      Gamma: 0.985
      Lambda: 0.95
      EpsilonClip: 0.2
      K_epochs: 3
      Minibatch: 16384
      CriticCoef: 1
      EntropyCoef: 3.e-4
      KL_threshold: 0.01
      Max_grad_norm: 100
      Warmup_steps: 1000
      Act: SiLU
      Optimiser: Laprop
      Adam:
        LearningRate: 3.e-5
        Epsilon: 1.0e-5
      Laprop:
        LearningRate: 4.0e-5
        Epsilon: 1.0e-20
      Actor:
        HiddenUnits: 256
      Critic:
        HiddenUnits: 512 # Andrychowicz2020 wider critic network seems better  
Wandb:
  Init:
    Mode: online
    Project: Mamba_dreamer
n: standard